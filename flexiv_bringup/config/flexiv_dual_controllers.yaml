controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    flexiv_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gpio_controller:
      type: gpio_controller/GPIOController

    left_flexiv_robot_states_broadcaster:
      type: flexiv_robot_states_broadcaster/FlexivRobotStatesBroadcaster

    right_flexiv_robot_states_broadcaster:
      type: flexiv_robot_states_broadcaster/FlexivRobotStatesBroadcaster

flexiv_arm_controller:
  ros__parameters:
    # Both arms share one `robot_sn`, so `left`/`right` alone already
    # disambiguate joints — must match `use_sn_prefix="false"` in the
    # Enlight-LL branch of `flexiv_description`'s `flexiv.urdf.xacro`.
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    # Allow MoveIt to command a single-arm planning group (left_arm / right_arm) on this 14-joint
    # controller.
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

left_flexiv_robot_states_broadcaster:
  ros__parameters:
    robot_sn: left

right_flexiv_robot_states_broadcaster:
  ros__parameters:
    robot_sn: right
